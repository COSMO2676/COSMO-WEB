<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMO Market</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>COSMO Market</h1>
        <p>Eksklyuziv mahsulotlar va tezkor xizmat ko'rsatish platformasi</p>
    </section>

    <!-- MAHSULOTLAR (PRODUCTS) -->
    <section class="products">
        <h2>Ommabop Mahsulotlar</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="product-img"><i class="fa-solid fa-box-open"></i></div>
                <h3>VIP Sovg'alar To'plami</h3>
                <p class="price">250 000 UZS</p>
                <button class="buy-btn">Sotib olish</button>
            </div>
            <div class="product-card">
                <div class="product-img"><i class="fa-solid fa-truck-fast"></i></div>
                <h3>Tezkor Etkazib Berish</h3>
                <p class="price">Bepul</p>
                <button class="buy-btn">Buyurtma berish</button>
            </div>
        </div>
    </section>

    <!-- 3-RASMDAGI KABI SHAFFOF, BIR QATORLIK NAVIGATSIYA MENYU -->
    <div class="floating-nav-container">
        <nav class="glass-nav">
            <button class="nav-item active" onclick="selectTab(this)">
                <i class="fa-solid fa-house"></i>
                <span>Bosh sahifa</span>
            </button>
            <button class="nav-item" onclick="selectTab(this)">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Qidiruv</span>
            </button>
            <button class="nav-item" onclick="selectTab(this)">
                <i class="fa-solid fa-layer-group"></i>
                <span>Katalog</span>
            </button>
            <button class="nav-item" onclick="selectTab(this)">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Savat</span>
            </button>
            <button class="nav-item" onclick="selectTab(this)">
                <i class="fa-solid fa-user"></i>
                <span>Profil</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
